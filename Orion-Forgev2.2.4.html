    function GeminiSpaceSection({ notes, onBackToMore }) {
      const [apiKey, setApiKey] = useState(localStorage.getItem("orion_gemini_key") || "");
      const [connected, setConnected] = useState(!!localStorage.getItem("orion_gemini_key"));
      const [aiPrompt, setAiPrompt] = useState("");
      const [response, setResponse] = useState("");
      const [loading, setLoading] = useState(false);
      const [flashcards, setFlashcards] = useState([]);
      const [flippedCard, setFlippedCard] = useState({});

      const [googleAccount, setGoogleAccount] = useState(localStorage.getItem("orion_google_account") || "");
      const [showAccountInput, setShowAccountInput] = useState(false);
      const [emailInput, setEmailInput] = useState("");

      const handleSaveKey = (e) => {
        e.preventDefault();
        if (!apiKey.trim()) return;
        localStorage.setItem("orion_gemini_key", apiKey.trim());
        setConnected(true);
        alert("Gemini API key saved successfully!");
      };

      const handleLinkGoogleAccount = (e) => {
        e.preventDefault();
        if (!emailInput.trim()) return;
        localStorage.setItem("orion_google_account", emailInput.trim());
        setGoogleAccount(emailInput.trim());
        setShowAccountInput(false);
      };

      const handleGenerateFlashcards = async () => {
        if (!notes || notes.length === 0) {
          alert("Please add some study notes first to generate flashcards.");
          return;
        }
        setLoading(true);
        setResponse("");
        try {
          const key = localStorage.getItem("orion_gemini_key");
          const noteText = notes.map(n => `Title: ${n.title}\nContent: ${n.content}`).join("\n\n");
          
          if (!key) {
            // Mock intelligent flashcards if no key provided yet
            setTimeout(() => {
              setFlashcards([
                { id: 1, q: "What is the primary rule of the ARC / Orion Protocol?", a: "90-Minute Focus Block with zero notifications and active recall over passive reading." },
                { id: 2, q: "Explain the Feynman Technique step 3.", a: "Pinpoint exact moments where explanation stumbles or uses hand-waving." },
                { id: 3, q: "What is the Stoic Shinobi mindset regarding test pressure?", a: "Accept pressure as a refining fire. Detach ego from practice test scores." }
              ]);
              setLoading(false);
            }, 1000);
            return;
          }

          // Real call to Gemini API using @google/genai pattern
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{
                parts: [{
                  text: `Based on these study notes, generate 3 high-yield Q&A flashcards in valid JSON format as an array of objects with keys "q" and "a":\n\n${noteText}`
                }]
              }]
            })
          });
          const data = await res.json();
          const text = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
          setResponse(text);
          setLoading(false);
        } catch (err) {
          console.error(err);
          setLoading(false);
          alert("Failed to generate via Gemini: " + err.message);
        }
      };

                <div className="space-y-1.5">
                  <span className="text-[10px] font-bold text-gray-400 uppercase tracking-wider block">Direct Raw GitHub File Links</span>
                  <div className="grid grid-cols-1 gap-1.5 max-h-48 overflow-y-auto scrollbar-none pr-1">
                    {rawFiles.map((rf, idx) => (
                      <a
                        key={idx}
                        href={rf.url}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="p-2 rounded-lg bg-white/[0.04] border border-white/[0.06] hover:bg-white/[0.08] hover:border-emerald-500/40 transition flex items-center justify-between text-xs group"
                      >
                        <div className="truncate pr-2">
                          <span className="font-mono text-emerald-400 font-bold block">{rf.name}</span>
                          <span className="text-[10px] text-gray-400 truncate block">{rf.label}</span>
                        </div>
                        <span className="text-[10px] font-mono text-gray-500 group-hover:text-emerald-300 shrink-0">RAW ↗</span>
                      </a>
                    ))}
                  </div>
                </div>

                {/* Developer Terminal Commands */}
                <div className="space-y-1.5 pt-1 border-t border-white/[0.08]">
                  <span className="text-[10px] font-bold text-gray-400 uppercase tracking-wider block">Developer Self-Hosting & Build Commands</span>
                  <div className="p-2.5 rounded-lg bg-black/80 font-mono text-[10px] text-emerald-300 space-y-1 border border-white/[0.06] overflow-x-auto">
                    <div>git clone https://github.com/Jitvaraj/Orion-Forge.git</div>
                    <div>cd Orion-Forge && npm install</div>
                    <div>npm run dev # Launches local server</div>
                    <div>npx cap build android # Builds Android APK</div>
                  </div>
                </div>
              </div>
            )}

            <button
              onClick={onClose}
              className="w-full py-2.5 rounded-xl bg-appGreen text-black text-xs font-bold hover:bg-green-400 transition shadow-lg shadow-green-500/20"
            >
              Close Guide
            </button>
          </div>
        </div>
      );
    }

    // ==========================================
    // 8. SETTINGS & PRESETS MODAL
    // ==========================================
    function SettingsModal({ onClose, onExport, onImport, onResetPresets, onTriggerInstall, isAppInstalled, onCheckUpdates, checkingUpdate, currentVersion, onOpenInstallGuide }) {
      return (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
          <div className="bg-[#121212] border border-white/[0.1] rounded-2xl p-5 max-w-sm w-full space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto scrollbar-none">
            <div className="flex items-center justify-between border-b border-white/[0.08] pb-2">
              <h3 className="text-sm font-semibold text-white">Device Apps & Settings</h3>
              <button onClick={onClose} className="text-gray-400 hover:text-white text-xs">✕</button>
            </div>

            <p className="text-xs text-gray-400 leading-relaxed">
              <strong>ORION v{currentVersion || "2.2.4"}</strong> operates completely offline with IndexedDB. Install it on Android, Windows, or iOS.
            </p>

            {/* View Guide Button */}
            <button
              onClick={() => {
                if (onOpenInstallGuide) onOpenInstallGuide();
              }}
              className="w-full py-2.5 rounded-xl bg-teal-500/20 border border-teal-500/40 text-teal-300 text-xs font-bold hover:bg-teal-500/30 transition flex items-center justify-center space-x-1.5 shadow-lg shadow-teal-500/10"
            >
              <span>📖 Full Installation & GitHub Files Guide</span>
            </button>

            {/* Version Update Checker Section */}
            <div className="p-3 rounded-xl bg-black/60 border border-white/[0.08] space-y-2">
              <div className="flex items-center justify-between">
                <span className="text-[10px] font-bold text-gray-400 uppercase tracking-wider block">App Updates</span>
                <span className="text-[10px] font-mono text-emerald-400">v{currentVersion || "2.2.4"}</span>
              </div>
              <button
                onClick={onCheckUpdates}
                disabled={checkingUpdate}
                className="w-full py-2 rounded-xl bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 text-xs font-bold hover:bg-emerald-500/30 transition flex items-center justify-center space-x-1.5"
              >
                <span>{checkingUpdate ? "Checking..." : "🔄 Check for Updates"}</span>
              </button>
            </div>

            {/* Platform Applications Section */}
            <div className="p-3 rounded-xl bg-black/60 border border-white/[0.08] space-y-2">
              <span className="text-[10px] font-bold text-gray-400 uppercase tracking-wider block">Cross-Platform Applications</span>
              
              {!isAppInstalled && (
                <button
                  onClick={() => {
                    onTriggerInstall();
                    onClose();
                  }}
                  className="w-full py-2 rounded-xl bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 text-xs font-bold hover:bg-emerald-500/30 transition flex items-center justify-center space-x-1.5"
                >
                  <span>📲 Instant PWA Install (All Devices)</span>
                </button>
              )}

              <a
                href="https://github.com/Jitvaraj/Orion-Forge/releases"
                target="_blank"
                rel="noopener noreferrer"
                className="w-full py-2 rounded-xl bg-blue-500/10 border border-blue-500/30 text-blue-300 text-xs font-semibold hover:bg-blue-500/20 transition flex items-center justify-center space-x-1.5"
              >
                <span>🤖 Android App Package (APK)</span>
              </a>

              <a
                href="https://github.com/Jitvaraj/Orion-Forge/releases"
                target="_blank"
                rel="noopener noreferrer"
                className="w-full py-2 rounded-xl bg-purple-500/10 border border-purple-500/30 text-purple-300 text-xs font-semibold hover:bg-purple-500/20 transition flex items-center justify-center space-x-1.5"
              >
                <span>💻 Windows Desktop Package</span>
              </a>

              <button
                onClick={() => {
                  onTriggerInstall();
                  onClose();
                }}
                className="w-full py-2 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-300 text-xs font-semibold hover:bg-amber-500/20 transition flex items-center justify-center space-x-1.5"
              >
                <span>📱 iPhone / iPad (iOS Safari PWA)</span>
              </button>
            </div>

            {/* Data & Presets Actions */}
            <div className="space-y-2 pt-1">
              <button
                onClick={() => {
                  onResetPresets();
                  onClose();
                }}
                className="w-full py-2.5 rounded-xl border border-appGreen/40 bg-appGreenSubtle text-appGreen text-xs font-semibold hover:bg-appGreen/20 transition flex items-center justify-center space-x-1.5"
              >
                <span>⚡ Load Curated Presets</span>
              </button>

              <button
                onClick={onExport}
                className="w-full py-2.5 rounded-xl bg-white/[0.06] border border-white/[0.08] text-white text-xs font-medium hover:bg-white/[0.1] transition"
              >
                Export Offline JSON Backup
              </button>

              <label className="w-full py-2.5 rounded-xl border border-white/[0.08] text-gray-300 text-xs font-medium hover:bg-white/[0.06] transition flex items-center justify-center cursor-pointer">
                <span>Restore Backup File</span>
                <input
                  type="file"
                  accept=".json"
                  onChange={onImport}
                  className="hidden"
                />
              </label>
            </div>

            <p className="text-[10px] text-gray-500 text-center">Orion v{currentVersion || "2.2.4"} · Progressive Web App (PWA) · github.com/Jitvaraj/Orion-Forge</p>
          </div>
        </div>
      );
    }

    // Mount to DOM
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
