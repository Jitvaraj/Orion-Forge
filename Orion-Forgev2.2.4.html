      } catch (e) {
        console.warn("[Alert blocked by sandbox]", msg);

    const _origConfirm = window.confirm;

        console.warn("[Confirm blocked by sandbox, defaulting to true]", msg);

    // --- IndexedDB Safe Engine (ArcPersonalDB v2) ---
    const DB_NAME = "ArcPersonalDB";
    const DB_VERSION = 2;

    function openDatabase() {
      return new Promise((resolve, reject) => {
        try {
          if (typeof indexedDB === "undefined") {
            return reject(new Error("IndexedDB is not supported in this browser"));
          }
          const req = indexedDB.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = (e) => {
            const db = (e && e.target ? e.target.result : null) || req.result;
            if (!db) return;
            if (!db.objectStoreNames.contains("journals")) db.createObjectStore("journals", { keyPath: "date" });
            if (!db.objectStoreNames.contains("tracker")) db.createObjectStore("tracker", { keyPath: "date" });
            if (!db.objectStoreNames.contains("habits")) db.createObjectStore("habits", { keyPath: "id" });
            if (!db.objectStoreNames.contains("habitLogs")) db.createObjectStore("habitLogs", { keyPath: "date" });
            if (!db.objectStoreNames.contains("workouts")) db.createObjectStore("workouts", { keyPath: "id" });
            if (!db.objectStoreNames.contains("scheduledWorkouts")) db.createObjectStore("scheduledWorkouts", { keyPath: "id" });
            if (!db.objectStoreNames.contains("quotes")) db.createObjectStore("quotes", { keyPath: "id" });
            if (!db.objectStoreNames.contains("notes")) db.createObjectStore("notes", { keyPath: "id" });
            if (!db.objectStoreNames.contains("exams")) db.createObjectStore("exams", { keyPath: "id" });
            if (!db.objectStoreNames.contains("meta")) db.createObjectStore("meta", { keyPath: "key" });
          };
          req.onsuccess = (e) => resolve(req.result || (e && e.target ? e.target.result : null));
          req.onerror = (e) => reject(req.error || (e && e.target ? e.target.error : new Error("IndexedDB error")));
        } catch (e) {
          reject(e);
        }
      });
    }

    async function dbGetAll(storeName) {
      try {
        const db = await openDatabase();
        return new Promise((res, rej) => {
          const tx = db.transaction(storeName, "readonly");
          const store = tx.objectStore(storeName);
          const req = store.getAll();
          req.onsuccess = (e) => res(req.result || (e && e.target ? e.target.result : []));
          req.onerror = (e) => rej(req.error || (e && e.target ? e.target.error : new Error("getAll error")));
        });
      } catch (err) {
        return JSON.parse(localStorage.getItem(`arc_${storeName}`) || "[]");
      }
    }

    async function dbPut(storeName, item) {
      try {
        const db = await openDatabase();
        return new Promise((res, rej) => {
          const tx = db.transaction(storeName, "readwrite");
          const store = tx.objectStore(storeName);
          const req = store.put(item);
          req.onsuccess = (e) => res(req.result || (e && e.target ? e.target.result : null));
          req.onerror = (e) => rej(req.error || (e && e.target ? e.target.error : new Error("put error")));
        });
      } catch (err) {
        const existing = JSON.parse(localStorage.getItem(`arc_${storeName}`) || "[]");
        const idx = existing.findIndex(e => (e.id && e.id === item.id) || (e.date && e.date === item.date) || (e.key && e.key === item.key));
        if (idx >= 0) existing[idx] = item;
        else existing.push(item);
        localStorage.setItem(`arc_${storeName}`, JSON.stringify(existing));
      }
    }

    async function dbDelete(storeName, key) {
      try {
        const db = await openDatabase();
        return new Promise((res, rej) => {
          const tx = db.transaction(storeName, "readwrite");
          const store = tx.objectStore(storeName);
          const req = store.delete(key);
          req.onsuccess = () => res();
          req.onerror = (e) => rej(req.error || (e && e.target ? e.target.error : new Error("delete error")));
        });
      } catch (err) {
        let existing = JSON.parse(localStorage.getItem(`arc_${storeName}`) || "[]");
        existing = existing.filter(e => (e.id || e.date || e.key) !== key);
        localStorage.setItem(`arc_${storeName}`, JSON.stringify(existing));
      }
    }

    // --- Real-Time Compression Utilities (Base64/JSON Compressed Engine) ---
    function compressState(stateObj) {
      try {
        const jsonStr = JSON.stringify(stateObj);
        const utf8Bytes = new TextEncoder().encode(jsonStr);
        let binaryStr = "";
        for (let i = 0; i < utf8Bytes.length; i++) {
          binaryStr += String.fromCharCode(utf8Bytes[i]);
        }
        return btoa(binaryStr);
      } catch (err) {
        console.warn("[Compression Error]", err);
        return null;
      }
    }

    function decompressState(compressedStr) {
      try {
        if (!compressedStr) return null;
        const binaryStr = atob(compressedStr);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) {
          bytes[i] = binaryStr.charCodeAt(i);
        }
        const jsonStr = new TextDecoder().decode(bytes);
        return JSON.parse(jsonStr);
      } catch (err) {
        console.warn("[Decompression Error]", err);
        return null;
      }
    }

    async function autoSaveCompressedSnapshot(storesObj) {
      try {
        const compressed = compressState({
          ...storesObj,
          savedAt: new Date().toISOString(),
          version: "2.2.4"
        });
        if (compressed) {
          localStorage.setItem("orion_autosave_compressed", compressed);
          await dbPut("meta", { key: "autosave_snapshot", data: compressed, updatedAt: new Date().toISOString() });
        }
      } catch (err) {
        console.warn("[Auto-Save Failed]", err);
      }
    }

    const IconFocus = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.75" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>;
    const IconMore = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5" strokeWidth="1.75"/><rect x="14" y="3" width="7" height="7" rx="1.5" strokeWidth="1.75"/><rect x="3" y="14" width="7" height="7" rx="1.5" strokeWidth="1.75"/><rect x="14" y="14" width="7" height="7" rx="1.5" strokeWidth="1.75"/></svg>;

    // --- Circular Progress Gauge Component ---
    function CircularProgress({ percentage, size = 76, strokeWidth = 6.5, label = "" }) {
      const radius = (size - strokeWidth) / 2;
      const circumference = radius * 2 * Math.PI;
      const validPct = isNaN(percentage) ? 0 : Math.min(100, Math.max(0, percentage));
      const strokeDashoffset = circumference - (validPct / 100) * circumference;

      return (
        <div className="relative inline-flex items-center justify-center shrink-0" style={{ width: size, height: size }}>
          <svg className="transform -rotate-90" width={size} height={size}>
            <circle cx={size / 2} cy={size / 2} r={radius} stroke="rgba(255, 255, 255, 0.08)" strokeWidth={strokeWidth} fill="transparent" />
            <circle
              cx={size / 2}
              cy={size / 2}
              r={radius}
              stroke="#4ADE80"
              strokeWidth={strokeWidth}
              strokeDasharray={circumference}
              strokeDashoffset={strokeDashoffset}
              strokeLinecap="round"
              fill="transparent"
              style={{ transition: "stroke-dashoffset 0.6s cubic-bezier(0.16, 1, 0.3, 1)" }}
            />
          </svg>
          <div className="absolute flex flex-col items-center justify-center text-center">
            <span className="text-xs font-semibold tracking-tight text-white font-mono tabular-nums">
              {Math.round(validPct)}%
            </span>
            {label && <span className="text-[9px] text-gray-400 -mt-0.5">{label}</span>}
          </div>
        </div>
      );
    }

    // ==========================================
    // MAIN APP COMPONENT
    // ==========================================
    function App() {
      const [activeTab, setActiveTab] = useState("tracker");
      const [today] = useState(new Date());

      // Global Stores State
      const [habits, setHabits] = useState([]);
      const [habitLogs, setHabitLogs] = useState({});
      const [workouts, setWorkouts] = useState([]);
      const [scheduledWorkouts, setScheduledWorkouts] = useState([]);
      const [journals, setJournals] = useState({});
      const [quotes, setQuotes] = useState([]);
      const [notes, setNotes] = useState([]);
      const [exams, setExams] = useState([]);

      // Active Calendar Selected Date
      const [selectedDate, setSelectedDate] = useState(new Date());
      const [showDateModal, setShowDateModal] = useState(false);
      const [showSettingsModal, setShowSettingsModal] = useState(false);
      const [showInstallGuideModal, setShowInstallGuideModal] = useState(false);

      // PWA Install & Version Check State
      const CURRENT_VERSION = "2.2.4";
      const [deferredPrompt, setDeferredPrompt] = useState(null);
      const [isAppInstalled, setIsAppInstalled] = useState(false);
      const [isIOSDevice, setIsIOSDevice] = useState(false);
      const [showIOSGuide, setShowIOSGuide] = useState(false);

      const [isDataLoaded, setIsDataLoaded] = useState(false);
      const [lastSavedTime, setLastSavedTime] = useState(null);

      const [updateAvailable, setUpdateAvailable] = useState(null);
      const [showUpdateModal, setShowUpdateModal] = useState(false);
      const [checkingUpdate, setCheckingUpdate] = useState(false);

      const checkForUpdates = async (isManual = false) => {
        setCheckingUpdate(true);
        try {
          const res = await fetch(`/version.json?t=${Date.now()}`);
          if (!res.ok) throw new Error("Fetch failed");
          const data = await res.json();
          if (data && data.latestVersion && data.latestVersion !== CURRENT_VERSION) {
            setUpdateAvailable(data);
            if (isManual) setShowUpdateModal(true);
          } else if (isManual) {
            alert(`Orion is up to date! (v${CURRENT_VERSION})`);
          }
        } catch (err) {
          console.log("Offline or version check error:", err);
          if (isManual) alert("Unable to check for updates right now. Please verify your connection.");
        } finally {
          setCheckingUpdate(false);
        }
      };

      useEffect(() => {
        checkForUpdates(false);
      }, []);

      useEffect(() => {
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        setIsAppInstalled(isStandalone);

        const ua = window.navigator.userAgent.toLowerCase();
        setIsIOSDevice(/iphone|ipad|ipod/.test(ua));

        const handleBeforeInstall = (e) => {
          e.preventDefault();
          setDeferredPrompt(e);
        };
        const handleInstalled = () => {
          setIsAppInstalled(true);
          setDeferredPrompt(null);
        };

        window.addEventListener('beforeinstallprompt', handleBeforeInstall);
        window.addEventListener('appinstalled', handleInstalled);

        return () => {
          window.removeEventListener('beforeinstallprompt', handleBeforeInstall);
          window.removeEventListener('appinstalled', handleInstalled);
        };
      }, []);

      const handleTriggerInstall = async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          if (outcome === 'accepted') {
            setIsAppInstalled(true);
            setDeferredPrompt(null);
          }
        } else if (isIOSDevice) {
          setShowIOSGuide(true);
        } else {
          alert("To install Orion as an app, tap 'Add to Home Screen' or 'Install' in your browser menu options.");
        }
      };

      // Load initial data from IndexedDB
      useEffect(() => {
        (async () => {
          // 1. Habits
          let hRecords = await dbGetAll("habits");
          if (!hRecords || hRecords.length === 0) {
            hRecords = STARTER_HABITS;
            for (let h of hRecords) await dbPut("habits", h);
          }
          setHabits(hRecords);

          // 2. Habit Daily Logs
          const hlRecords = await dbGetAll("habitLogs");
          const hlMap = {};
          (hlRecords || []).forEach(hl => { if (hl && hl.date) hlMap[hl.date] = hl; });

          // Backward compatibility check with legacy single-habit tracker table
          const legacyTracker = await dbGetAll("tracker");
          if (legacyTracker && legacyTracker.length > 0) {
            legacyTracker.forEach(lt => {
              if (lt.status === "YES" && !hlMap[lt.date]) {
                hlMap[lt.date] = { date: lt.date, completed: ["h_deepwork"], reflection: lt.reflection || "" };
              }
            });
          }
          setHabitLogs(hlMap);

          // 3. Workouts
          let wRecords = await dbGetAll("workouts");
          if (!wRecords || wRecords.length === 0) {
            wRecords = getStarterWorkouts();
            for (let w of wRecords) await dbPut("workouts", w);
          }
          setWorkouts((wRecords || []).sort((a,b) => new Date(b.date) - new Date(a.date)));

          // 4. Scheduled Workouts
          let swRecords = await dbGetAll("scheduledWorkouts");
          if (!swRecords || swRecords.length === 0) {
            swRecords = getStarterScheduled();
            for (let s of swRecords) await dbPut("scheduledWorkouts", s);
          }
          setScheduledWorkouts(swRecords || []);

          // 5. Journals
          const jRecords = await dbGetAll("journals");
          const jMap = {};
          (jRecords || []).forEach(j => { if (j && j.date) jMap[j.date] = j.content; });
          setJournals(jMap);

          // 6. Quotes
          let qRecords = await dbGetAll("quotes");
          if (!qRecords || qRecords.length === 0) {
            qRecords = STARTER_QUOTES;
            for (let q of qRecords) await dbPut("quotes", q);
          }
          setQuotes((qRecords || []).sort((a,b) => (a.rank || 999) - (b.rank || 999)));

          // 7. Notes
          let nRecords = await dbGetAll("notes");
          if (!nRecords || nRecords.length === 0) {
            nRecords = STARTER_NOTES;
            for (let n of nRecords) await dbPut("notes", n);
          }
          setNotes((nRecords || []).sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt)));

          // 8. Exams
          let eRecords = await dbGetAll("exams");
          if (!eRecords || eRecords.length === 0) {
            eRecords = getStarterExams();
            for (let e of eRecords) await dbPut("exams", e);
          }
          setExams((eRecords || []).sort((a,b) => new Date(b.date) - new Date(a.date)));
          setIsDataLoaded(true);
        })().catch(err => console.error("Database initialization error:", err));
      }, []);

      // Real-Time Compressed Auto-Save Effect (Triggers on every state update)
      useEffect(() => {
        if (!isDataLoaded) return;
        const stores = {
          habits,
          habitLogs: Object.values(habitLogs),
          workouts,
          scheduledWorkouts,
          journals: Object.entries(journals).map(([date, content]) => ({ date, content })),
          quotes,
          notes,
          exams
        };
        autoSaveCompressedSnapshot(stores);
        setLastSavedTime(new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
      }, [habits, habitLogs, workouts, scheduledWorkouts, journals, quotes, notes, exams, isDataLoaded]);

      // Habit streak calculation helper
      const habitStreaks = useMemo(() => {
        const streaks = {};
        const todayKey = formatDateKey(today);

        habits.forEach(h => {
          let current = 0;
          let best = 0;
          let running = 0;

          const sortedDates = Object.keys(habitLogs).sort();
          if (sortedDates.length > 0) {
            let d = parseDateKey(sortedDates[0]);
            const endD = new Date(today);
            while (d <= endD) {
              const k = formatDateKey(d);
              const isDone = habitLogs[k]?.completed?.includes(h.id);
              if (isDone) {
                running++;
                if (running > best) best = running;
              } else {
                running = 0;
              }
              d.setDate(d.getDate() + 1);
            }
          }

          let checkD = new Date(today);
          const isDoneToday = habitLogs[todayKey]?.completed?.includes(h.id);
          if (!isDoneToday) {
            checkD.setDate(checkD.getDate() - 1);
          }
          while (true) {
            const k = formatDateKey(checkD);
            if (habitLogs[k]?.completed?.includes(h.id)) {
              current++;
              checkD.setDate(checkD.getDate() - 1);
            } else {
              break;
            }
          }

          streaks[h.id] = { current, best: Math.max(best, current) };
        });

        return streaks;
      }, [habits, habitLogs, today]);

      // Overall Daily Completion Rate
      const todayKey = formatDateKey(today);
      const todayLog = habitLogs[todayKey] || { date: todayKey, completed: [] };
      const todayCompletedCount = todayLog.completed ? todayLog.completed.length : 0;
      const todayPercentage = habits.length > 0 ? (todayCompletedCount / habits.length) * 100 : 0;

      // Toggle a habit completion
      const handleToggleHabit = async (habitId, dateStr = todayKey) => {
        const existing = habitLogs[dateStr] || { date: dateStr, completed: [] };
        const isCompleted = existing.completed.includes(habitId);
        const updatedCompleted = isCompleted
          ? existing.completed.filter(id => id !== habitId)
          : [...existing.completed, habitId];

        const updatedEntry = {
          ...existing,
          date: dateStr,
          completed: updatedCompleted,
          updatedAt: new Date().toISOString()
        };

        await dbPut("habitLogs", updatedEntry);
        setHabitLogs(prev => ({ ...prev, [dateStr]: updatedEntry }));
      };

      // Set reflection note for a day
      const handleSaveReflection = async (dateStr, text) => {
        const existing = habitLogs[dateStr] || { date: dateStr, completed: [] };
        const updatedEntry = { ...existing, reflection: text, updatedAt: new Date().toISOString() };
        await dbPut("habitLogs", updatedEntry);
        setHabitLogs(prev => ({ ...prev, [dateStr]: updatedEntry }));
      };

      // Reset to presets
      const handleResetToPresets = async () => {
        if (!confirm("Load recommended presets for habits, workouts, and ranked quotes? This will restore curated defaults.")) return;
        
        for (let h of STARTER_HABITS) await dbPut("habits", h);
        setHabits(STARTER_HABITS);

        for (let q of STARTER_QUOTES) await dbPut("quotes", q);
        setQuotes(STARTER_QUOTES);

        const sWorkouts = getStarterWorkouts();
        for (let w of sWorkouts) await dbPut("workouts", w);
        setWorkouts(prev => {
          const ids = new Set(sWorkouts.map(s => s.id));
          return [...sWorkouts, ...prev.filter(p => !ids.has(p.id))].sort((a,b) => new Date(b.date) - new Date(a.date));
        });

        const sSched = getStarterScheduled();
        for (let s of sSched) await dbPut("scheduledWorkouts", s);
        setScheduledWorkouts(prev => {
          const ids = new Set(sSched.map(s => s.id));
          return [...sSched, ...prev.filter(p => !ids.has(p.id))];
        });

        for (let n of STARTER_NOTES) await dbPut("notes", n);
        setNotes(STARTER_NOTES);

        const sExams = getStarterExams();
        for (let e of sExams) await dbPut("exams", e);
        setExams(sExams);

        alert("Curated presets loaded successfully!");
      };

      // Backup & Restore
      const handleExport = () => {
        const payload = {
          version: 2,
          exportedAt: new Date().toISOString(),
          habits,
          habitLogs: Object.values(habitLogs),
          workouts,
          scheduledWorkouts,
          journals: Object.entries(journals).map(([date, content]) => ({ date, content })),
          quotes,
          notes,
          exams
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `arc_backup_v2_${formatDateKey(new Date())}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };

      const handleImport = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (!data) throw new Error("Invalid backup file.");

            if (data.habits) for (let h of data.habits) await dbPut("habits", h);
            if (data.habitLogs) for (let hl of data.habitLogs) await dbPut("habitLogs", hl);
            if (data.workouts) for (let w of data.workouts) await dbPut("workouts", w);
            if (data.scheduledWorkouts) for (let s of data.scheduledWorkouts) await dbPut("scheduledWorkouts", s);
            if (data.journals) for (let j of data.journals) await dbPut("journals", j);
            if (data.quotes) for (let q of data.quotes) await dbPut("quotes", q);
            if (data.notes) for (let n of data.notes) await dbPut("notes", n);
            if (data.exams) for (let ex of data.exams) await dbPut("exams", ex);

            alert("Backup restored successfully.");
            window.location.reload();
          } catch (err) {
            alert("Failed to restore backup: " + err.message);
          }
        };
        reader.readAsText(file);
      };

      return (
        <div className="flex flex-col h-full max-w-md mx-auto bg-[#050505] border-x border-white/[0.08] overflow-hidden relative shadow-2xl">
          
          {/* Subtle Ambient Emerald Glow */}
          <div className="pointer-events-none absolute -top-24 left-1/2 -translate-x-1/2 w-96 h-96 bg-emerald-500/10 rounded-full blur-[100px] z-0"></div>

          {/* Top Glassmorphic App Bar */}
          <header className="px-5 pt-3.5 pb-2.5 flex items-center justify-between text-xs text-gray-400 select-none border-b border-white/[0.08] bg-[#050505]/80 backdrop-blur-xl z-20 shrink-0">
            <div className="flex items-center space-x-2.5">
              <img src="/icon.svg" className="w-5 h-5 rounded-md shadow-[0_0_10px_rgba(74,222,128,0.4)]" alt="Orion Emblem" />
              <span className="font-bold text-white tracking-widest text-[14px]">ORION</span>
              <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-white/[0.06] text-gray-300 border border-white/[0.06]">
                v{CURRENT_VERSION}
              </span>
            </div>
            <div className="flex items-center space-x-2.5">
              {!isAppInstalled && (
                <button
                  onClick={handleTriggerInstall}
                  className="px-2.5 py-1 rounded-full bg-emerald-500/15 border border-emerald-500/30 text-emerald-400 text-[10px] font-bold hover:bg-emerald-500/30 transition flex items-center space-x-1"
                  title="Install Orion App on Phone or PC"
                >
                  <span>📲</span>
                  <span>Install</span>
                </button>
              )}
              <span className="text-[11px] text-gray-400 font-medium tracking-wide">
                {today.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' })}
              </span>
              <button 
                onClick={() => setShowSettingsModal(true)} 
                className="w-8 h-8 rounded-full flex items-center justify-center text-gray-400 hover:text-white bg-white/[0.04] hover:bg-white/[0.08] border border-white/[0.06] transition"
                title="Settings & Data"
              >
                <IconSettings />
              </button>
            </div>
          </header>

          {/* Automatic Version Update Notification Banner */}
          {updateAvailable && (
            <div className="mx-4 mt-3 p-3 rounded-2xl bg-gradient-to-r from-emerald-600/30 via-teal-600/30 to-blue-600/30 border border-emerald-400/40 backdrop-blur-xl flex items-center justify-between space-x-3 shadow-xl z-20 shrink-0">
              <div className="space-y-0.5 min-w-0">
                <div className="flex items-center space-x-1.5 text-xs font-bold text-emerald-300">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                  <span>Update Available (v{updateAvailable.latestVersion})</span>
                </div>
                <p className="text-[11px] text-gray-200 truncate">{updateAvailable.releaseNotes || "New version is ready."}</p>
              </div>
              <button
                onClick={() => setShowUpdateModal(true)}
                className="px-3 py-1.5 rounded-xl bg-appGreen text-black text-xs font-bold hover:bg-green-400 transition shrink-0 shadow-md"
              >
                View
              </button>
            </div>
          )}

          {/* Main Viewport Content */}
          <main className="flex-1 overflow-y-auto scrollbar-none pb-20 relative z-10">
            <div key={activeTab} className="animate-tab-fade">
              {activeTab === "tracker" && (
                <TrackerSection
                  today={today}
                  habits={habits}
                  habitLogs={habitLogs}
                  habitStreaks={habitStreaks}
                  quotes={quotes}
                  onNavigateToQuotes={() => setActiveTab("quotes")}
                  todayCompletedCount={todayCompletedCount}
                  todayPercentage={todayPercentage}
                  onToggleHabit={handleToggleHabit}
                  onSaveReflection={handleSaveReflection}
                  onAddHabit={async (h) => {
                    await dbPut("habits", h);
                    setHabits(prev => [...prev, h]);
                  }}
                  onUpdateHabit={async (h) => {
                    await dbPut("habits", h);
                    setHabits(prev => prev.map(p => p.id === h.id ? h : p));
                  }}
                  onDeleteHabit={async (id) => {
                    await dbDelete("habits", id);
                    setHabits(prev => prev.filter(p => p.id !== id));
                  }}
                />
              )}

              {activeTab === "calendar" && (
                <CalendarSection 
                  today={today}
                  selectedDate={selectedDate}
                  setSelectedDate={setSelectedDate}
                  habits={habits}
                  habitLogs={habitLogs}
                  scheduledWorkouts={scheduledWorkouts}
                  journals={journals}
                  onOpenDayDetails={() => setShowDateModal(true)}
                />
              )}

              {activeTab === "workout" && (
                <WorkoutSection
                  workouts={workouts}
                  scheduledWorkouts={scheduledWorkouts}
                  onAddWorkout={async (w) => {
                    await dbPut("workouts", w);
                    setWorkouts(prev => [w, ...prev.filter(item => item.id !== w.id)]);
                  }}
                  onDeleteWorkout={async (id) => {
                    await dbDelete("workouts", id);
                    setWorkouts(prev => prev.filter(w => w.id !== id));
                  }}
                  onAddScheduledWorkout={async (sw) => {
                    await dbPut("scheduledWorkouts", sw);
                    setScheduledWorkouts(prev => [...prev.filter(s => s.id !== sw.id), sw]);
                  }}
                  onDeleteScheduled={async (id) => {
                    await dbDelete("scheduledWorkouts", id);
                    setScheduledWorkouts(prev => prev.filter(s => s.id !== id));
                  }}
                />
              )}

              {activeTab === "more" && (
                <MoreSection
                  onNavigate={(tab) => setActiveTab(tab)}
                  onOpenSettings={() => setShowSettingsModal(true)}
                  onOpenInstallGuide={() => setShowInstallGuideModal(true)}
                />
              )}

              {activeTab === "quotes" && (
                <QuoteWallSection
                  quotes={quotes}
                  onBackToMore={() => setActiveTab("more")}
                  onSaveQuote={async (quote) => {
                    await dbPut("quotes", quote);
                    setQuotes(prev => {
                      const filtered = prev.filter(q => q.id !== quote.id);
                      return [...filtered, quote].sort((a,b) => (a.rank || 999) - (b.rank || 999));
                    });
                  }}
                  onDeleteQuote={async (id) => {
                    await dbDelete("quotes", id);
                    setQuotes(prev => prev.filter(q => q.id !== id));
                  }}
                />
              )}

              {activeTab === "notes" && (
                <NotesSection
                  notes={notes}
                  onBackToMore={() => setActiveTab("more")}
                  onSaveNote={async (note) => {
                    await dbPut("notes", note);
                    setNotes(prev => [note, ...prev.filter(n => n.id !== note.id)]);
                  }}
                  onDeleteNote={async (id) => {
                    await dbDelete("notes", id);
                    setNotes(prev => prev.filter(n => n.id !== id));
                  }}
                />
              )}

              {activeTab === "exams" && (
                <ExamMarksSection
                  exams={exams}
                  onBackToMore={() => setActiveTab("more")}
                  onAddExam={async (exam) => {
                    await dbPut("exams", exam);
                    setExams(prev => [exam, ...prev.filter(e => e.id !== exam.id)].sort((a,b) => new Date(b.date) - new Date(a.date)));
                  }}
                  onDeleteExam={async (id) => {
                    await dbDelete("exams", id);
                    setExams(prev => prev.filter(e => e.id !== id));
                  }}
                />
              )}

              {activeTab === "focus" && (
                <FocusSection />
              )}

              {activeTab === "gemini" && (
                <GeminiSpaceSection notes={notes} onBackToMore={() => setActiveTab("more")} />
              )}
            </div>
          </main>

          {/* Global Floating Gemini AI Button */}

    function CalendarSection({ today, selectedDate, setSelectedDate, habits, habitLogs, scheduledWorkouts, journals, onOpenDayDetails }) {
      const [viewMode, setViewMode] = useState("monthly");
      const [viewYear, setViewYear] = useState(today.getFullYear());
      const [viewMonth, setViewMonth] = useState(today.getMonth());

      const todayKey = formatDateKey(today);
      const selectedKey = formatDateKey(selectedDate);

      const calendarDays = useMemo(() => {
        const firstDayOfMonth = new Date(viewYear, viewMonth, 1).getDay();
        const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
        const days = [];

        const prevMonthDays = new Date(viewYear, viewMonth, 0).getDate();
        for (let i = firstDayOfMonth - 1; i >= 0; i--) {
          days.push({
            date: new Date(viewYear, viewMonth - 1, prevMonthDays - i, 12),
            currentMonth: false
          });
        }
        for (let d = 1; d <= daysInMonth; d++) {
          days.push({
            date: new Date(viewYear, viewMonth, d, 12),
            currentMonth: true
          });
        }
        const remaining = 42 - days.length;
        for (let n = 1; n <= remaining; n++) {
          days.push({
            date: new Date(viewYear, viewMonth + 1, n, 12),
            currentMonth: false
          });
        }
        return days;
      }, [viewYear, viewMonth]);

      const weeklyDays = useMemo(() => {
        const curr = new Date(selectedDate);
        const dayOfWeek = curr.getDay();
        const start = new Date(curr);
        start.setDate(curr.getDate() - dayOfWeek);
        const arr = [];
        for (let i = 0; i < 7; i++) {
          const d = new Date(start);
          d.setDate(start.getDate() + i);
          arr.push(d);
        }
        return arr;
      }, [selectedDate]);

      return (
        <div className="p-4 space-y-4">
          
          {/* Header & View Mode Switcher */}
          <div className="flex items-center justify-between">
            <h1 className="text-xl font-bold tracking-tight text-white">Calendar</h1>
            <div className="flex items-center space-x-1 glass-tile p-1 rounded-xl text-xs">
              {["monthly", "weekly", "yearly"].map(mode => (
                <button
                  key={mode}
                  onClick={() => setViewMode(mode)}
                  className={`px-3 py-1 rounded-lg capitalize font-medium transition ${
                    viewMode === mode ? "bg-white/[0.1] text-appGreen shadow-sm" : "text-gray-400 hover:text-white"
                  }`}
                >
                  {mode}
                </button>
              ))}
            </div>
          </div>

          {/* Month / Year Navigator */}
          {viewMode !== "yearly" ? (
            <div className="flex items-center justify-between text-sm py-1.5 border-b border-white/[0.06]">
              <span className="font-semibold text-white tracking-wide">
                {MONTH_NAMES[viewMonth]} <span className="text-gray-400 font-normal">{viewYear}</span>
              </span>
              <div className="flex items-center space-x-2">
                <button
                  onClick={() => {
                    if (viewMonth === 0) {
                      setViewMonth(11);
                      setViewYear(y => Math.max(2019, y - 1));
                    } else setViewMonth(m => m - 1);
                  }}
                  className="p-1.5 rounded-lg hover:bg-white/[0.06] text-gray-300"
                >
                  ‹
                </button>
                <button
                  onClick={() => {
                    setViewMonth(today.getMonth());
                    setViewYear(today.getFullYear());
                    setSelectedDate(new Date(today));
                  }}
                  className="text-xs text-appGreen font-medium px-2 py-0.5 rounded-md border border-appGreen/30 hover:bg-appGreenSubtle"
                >
                  Today
                </button>
                <button
                  onClick={() => {
                    if (viewMonth === 11) {
                      setViewMonth(0);
                      setViewYear(y => Math.min(2030, y + 1));
                    } else setViewMonth(m => m + 1);
                  }}
                  className="p-1.5 rounded-lg hover:bg-white/[0.06] text-gray-300"
                >
                  ›
                </button>
              </div>
            </div>
          ) : (
            <div className="flex items-center justify-between text-sm py-1.5 border-b border-white/[0.06]">
              <span className="font-semibold text-white tracking-wide">Year {viewYear}</span>
              <div className="flex items-center space-x-2">
                <button onClick={() => setViewYear(y => Math.max(2019, y - 1))} className="p-1.5 text-gray-300">‹</button>
                <button onClick={() => setViewYear(y => Math.min(2030, y + 1))} className="p-1.5 text-gray-300">›</button>
              </div>
            </div>
          )}

          {/* MONTHLY VIEW */}
          {viewMode === "monthly" && (
            <div>
              <div className="grid grid-cols-7 gap-1 text-center text-xs text-gray-400 mb-2 font-medium">
                {DAYS_SHORT.map(d => <span key={d}>{d}</span>)}
              </div>
              <div className="grid grid-cols-7 gap-1">
                {calendarDays.map((item, idx) => {
                  const dateKey = formatDateKey(item.date);
                  const isToday = dateKey === todayKey;
                  const isSelected = dateKey === selectedKey;
                  const log = habitLogs[dateKey];
                  const hasDoneHabits = log?.completed && log.completed.length > 0;
                  const hasWorkout = scheduledWorkouts.some(w => w.date === dateKey);
                  const hasJournal = !!journals[dateKey];

                  return (
                    <button
                      key={idx}
                      onClick={() => {
                        setSelectedDate(item.date);
                        setViewMonth(item.date.getMonth());
                        setViewYear(item.date.getFullYear());
                      }}
                      className={`h-11 rounded-xl flex flex-col items-center justify-center relative transition border ${
                        isSelected 
                          ? "bg-white/[0.12] border-white/40 text-white shadow-lg" 
                          : isToday 
                            ? "border-appGreen text-white bg-appGreenSubtle" 
                            : "border-transparent text-gray-300 hover:bg-white/[0.04]"
                      } ${!item.currentMonth ? "opacity-30" : ""}`}
                    >
                      <span className="text-xs font-medium font-mono tabular-nums">{item.date.getDate()}</span>
                      <div className="flex items-center space-x-1 mt-0.5 h-2">
                        {hasDoneHabits && <span className="w-1.5 h-1.5 rounded-full bg-appGreen"></span>}
                        {hasWorkout && <span className="w-1.5 h-1.5 rounded-full bg-blue-400"></span>}
                        {hasJournal && <span className="w-1.5 h-1.5 rounded-full bg-amber-400"></span>}
                      </div>
                    </button>
                  );
                })}
              </div>
            </div>
          )}

          {/* WEEKLY VIEW */}
          {viewMode === "weekly" && (
            <div className="space-y-3">
              <div className="grid grid-cols-7 gap-1 text-center">
                {weeklyDays.map((d, i) => {
                  const dKey = formatDateKey(d);
                  const isToday = dKey === todayKey;
                  const isSelected = dKey === selectedKey;
                  const log = habitLogs[dKey];
                  const doneCount = log?.completed ? log.completed.length : 0;
                  return (
                    <button
                      key={i}
                      onClick={() => setSelectedDate(d)}
                      className={`p-2.5 rounded-xl flex flex-col items-center border transition ${
                        isSelected 
                          ? "bg-white/[0.15] border-white/40 shadow-lg" 
                          : isToday 
                            ? "border-appGreen bg-appGreenSubtle" 
                            : "glass-panel"
                      }`}
                    >
                      <span className="text-[10px] text-gray-400">{DAYS_SHORT[d.getDay()]}</span>
                      <span className="text-sm font-bold mt-1 font-mono tabular-nums">{d.getDate()}</span>
                      {doneCount > 0 && (
                        <span className="text-[10px] text-appGreen font-mono mt-0.5">
                          {doneCount}✓
                        </span>
                      )}
                    </button>
                  );
                })}
              </div>
            </div>
          )}

          {/* YEARLY VIEW */}
          {viewMode === "yearly" && (
            <div className="grid grid-cols-3 gap-2.5">
              {MONTH_NAMES.map((name, mIdx) => {
                const daysInM = new Date(viewYear, mIdx + 1, 0).getDate();
                let checksInMonth = 0;
                for (let d = 1; d <= daysInM; d++) {
                  const k = formatDateKey(new Date(viewYear, mIdx, d));
                  if (habitLogs[k]?.completed?.length > 0) checksInMonth++;
                }

                return (
                  <button
                    key={name}
                    onClick={() => {
                      setViewMonth(mIdx);
                      setViewMode("monthly");
                    }}
                    className="p-3.5 rounded-2xl glass-panel hover:border-white/20 flex flex-col items-center justify-center text-center transition"
                  >
                    <span className="text-xs font-semibold text-white">{name.slice(0, 3)}</span>
                    <span className="text-[11px] text-appGreen font-mono mt-1 font-medium">{checksInMonth} days 🔥</span>
                  </button>
                );
              })}
            </div>
          )}

          {/* Selected Date Summary & Day Details Card */}
          <div className="p-4 rounded-2xl glass-panel space-y-3">
            <div className="flex items-center justify-between">
              <div>
                <p className="text-xs font-medium text-white">
                  {selectedDate.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' })}
                </p>
                <p className="text-xs text-gray-400 mt-0.5">
                  {habitLogs[selectedKey]?.completed?.length || 0} habits completed {journals[selectedKey] ? "· Journal recorded" : ""}
                </p>
              </div>
              <button
                onClick={onOpenDayDetails}
                className="px-3.5 py-1.5 rounded-xl bg-appGreen text-black text-xs font-semibold hover:bg-green-400 transition"
              >
                + Journal & Schedule
              </button>
            </div>

            {/* Scheduled list for selected date */}
            {scheduledWorkouts.filter(w => w.date === selectedKey).length > 0 && (
              <div className="space-y-1.5 pt-2 border-t border-white/[0.06]">
                <p className="text-[10px] font-semibold text-gray-400 uppercase tracking-wider">Scheduled Workouts</p>
                {scheduledWorkouts.filter(w => w.date === selectedKey).map(w => (
                  <div key={w.id} className="p-2 rounded-xl glass-tile flex items-center justify-between text-xs">
                    <div>
                      <span className="font-medium text-white">{w.title}</span>
                      <span className="text-gray-400 ml-2">{w.time || "Anytime"} {w.details ? `• ${w.details}` : ""}</span>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>

        </div>
      );
    }

    // ==========================================
    // 3. WORKOUTS 2.0 (HYPERTROPHY LOG)
    // ==========================================
    function WorkoutSection({ workouts, scheduledWorkouts, onAddWorkout, onDeleteWorkout, onAddScheduledWorkout, onDeleteScheduled }) {
      const [viewTab, setViewTab] = useState("log");
      const [exerciseName, setExerciseName] = useState("");
      const [weight, setWeight] = useState("");
      const [sets, setSets] = useState("");
      const [reps, setReps] = useState("");
      const [notes, setNotes] = useState("");
      const [dateVal, setDateVal] = useState(formatDateKey(new Date()));
      const [editingWorkoutId, setEditingWorkoutId] = useState(null);

      // Workout Scheduling form states
      const [schedTitle, setSchedTitle] = useState("");
      const [schedDate, setSchedDate] = useState(formatDateKey(new Date()));
      const [schedTime, setSchedTime] = useState("07:30");
      const [schedDetails, setSchedDetails] = useState("");

      const handleAddOrUpdate = (e) => {
        e.preventDefault();
        if (!exerciseName.trim()) return;
        const record = {
          id: editingWorkoutId || ("w_" + Date.now()),
          exerciseName: exerciseName.trim(),
          weight: Number(weight) || 0,
          sets: Number(sets) || 0,
          reps: Number(reps) || 0,
          notes: notes.trim(),
          date: dateVal
        };
        onAddWorkout(record);
        setExerciseName("");
        setWeight("");
        setSets("");
        setReps("");
        setNotes("");
        setEditingWorkoutId(null);
        setViewTab("history");
      };

      const startEdit = (w) => {
        setEditingWorkoutId(w.id);
        setExerciseName(w.exerciseName);
        setWeight(w.weight || "");
        setSets(w.sets || "");
        setReps(w.reps || "");
        setNotes(w.notes || "");
        setDateVal(w.date);
        setViewTab("log");
      };

      const handleScheduleSubmit = (e) => {
        e.preventDefault();
        if (!schedTitle.trim()) return;
        const item = {
          id: "sched_" + Date.now(),
          title: schedTitle.trim(),
          date: schedDate,
          time: schedTime,
          details: schedDetails.trim()
        };
        onAddScheduledWorkout(item);
        setSchedTitle("");
        setSchedDetails("");
      };

      return (
        <div className="p-4 space-y-4">
          <div className="flex items-center justify-between">
            <div>
              <h1 className="text-xl font-bold tracking-tight text-white">Workouts</h1>
              <p className="text-xs text-gray-400 mt-0.5">Bodyweight & dumbbell hypertrophy training</p>
            </div>
            <div className="flex glass-tile p-1 rounded-xl text-xs">
              <button
                onClick={() => setViewTab("log")}
                className={`px-3 py-1 rounded-lg font-medium transition ${
                  viewTab === "log" ? "bg-white/[0.1] text-appGreen" : "text-gray-400 hover:text-white"
                }`}
              >
                {editingWorkoutId ? "Edit" : "Log"}
              </button>
              <button
                onClick={() => setViewTab("history")}
                className={`px-3 py-1 rounded-lg font-medium transition ${
                  viewTab === "history" ? "bg-white/[0.1] text-appGreen" : "text-gray-400 hover:text-white"
                }`}
              >
                History ({workouts.length})
              </button>
              <button
                onClick={() => setViewTab("scheduled")}
                className={`px-3 py-1 rounded-lg font-medium transition ${
                  viewTab === "scheduled" ? "bg-white/[0.1] text-appGreen" : "text-gray-400 hover:text-white"
                }`}
              >
                Schedule ({scheduledWorkouts.length})
              </button>
            </div>
          </div>

          {viewTab === "log" && (
            <form onSubmit={handleAddOrUpdate} className="space-y-3 glass-panel p-4 rounded-2xl">
              <div className="flex items-center justify-between">
                <p className="text-xs font-semibold text-gray-300 uppercase tracking-wider">
                  {editingWorkoutId ? "Edit Workout Entry" : "Record Muscle Building Session"}
                </p>
                {editingWorkoutId && (
                  <button
                    type="button"
                    onClick={() => {
                      setEditingWorkoutId(null);
                      setExerciseName("");
                      setWeight("");
                      setSets("");
                      setReps("");
                      setNotes("");
                    }}
                    className="text-xs text-gray-400 hover:text-white"
                  >
                    Cancel
                  </button>
                )}
              </div>

              <div>
                <label className="text-[11px] text-gray-400">Exercise Movement</label>
                <input
                  type="text"
                  required
                  placeholder="e.g. Dumbbell Chest Press & Deficit Push-ups"
                  value={exerciseName}
                  onChange={(e) => setExerciseName(e.target.value)}
                  className="w-full mt-1 p-2.5 rounded-xl bg-black/70 border border-white/[0.08] text-xs text-white focus:outline-none focus:border-appGreen"
                />
              </div>

              <div className="grid grid-cols-3 gap-2">
                <div>
                  <label className="text-[11px] text-gray-400">Load (kg)</label>
                  <input
                    type="number"
                    step="0.5"
                    placeholder="0 = Body"
                    value={weight}
                    onChange={(e) => setWeight(e.target.value)}
                    className="w-full mt-1 p-2 rounded-xl bg-black/70 border border-white/[0.08] text-xs text-white focus:outline-none font-mono"
                  />
                </div>
                <div>
                  <label className="text-[11px] text-gray-400">Sets</label>
                  <input
                    type="number"
                    required
                    placeholder="4"
                    value={sets}
                    onChange={(e) => setSets(e.target.value)}
                    className="w-full mt-1 p-2 rounded-xl bg-black/70 border border-white/[0.08] text-xs text-white focus:outline-none font-mono"
                  />
                </div>
                <div>
                  <label className="text-[11px] text-gray-400">Reps</label>
                  <input
                    type="number"
                    required
                    placeholder="10"
                    value={reps}
                    onChange={(e) => setReps(e.target.value)}
                    className="w-full mt-1 p-2 rounded-xl bg-black/70 border border-white/[0.08] text-xs text-white focus:outline-none font-mono"
                  />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="text-[11px] text-gray-400">Date</label>
                  <input
                    type="date"
                    value={dateVal}
                    onChange={(e) => setDateVal(e.target.value)}
                    className="w-full mt-1 p-2 rounded-xl bg-black/70 border border-white/[0.08] text-xs text-white focus:outline-none"
                  />
                </div>
                <div>
                  <label className="text-[11px] text-gray-400">Notes (RPE / Form)</label>
                  <input
                    type="text"
                    placeholder="RPE 8.5, good squeeze"
                    value={notes}
                    onChange={(e) => setNotes(e.target.value)}
                    className="w-full mt-1 p-2 rounded-xl bg-black/70 border border-white/[0.08] text-xs text-white focus:outline-none"
                  />
                </div>
              </div>

              <button
                type="submit"
                className="w-full py-2.5 rounded-xl bg-appGreen text-black font-semibold text-xs mt-2 hover:bg-green-400 transition"
              >
                {editingWorkoutId ? "Update Workout Record" : "Save Workout Entry"}
              </button>
            </form>
          )}

          {viewTab === "history" && (
            <div className="space-y-2">
              {workouts.length === 0 ? (
                <p className="text-xs text-gray-500 italic text-center py-8">No workout logs recorded yet.</p>
              ) : (
                workouts.map(w => {
                  const totalVolume = (w.sets || 0) * (w.reps || 0) * (w.weight || 0);
                  return (
                    <div key={w.id} className="p-3.5 rounded-2xl glass-panel flex items-center justify-between hover:border-white/[0.14] transition">
                      <div className="min-w-0 pr-2">
                        <div className="flex items-center space-x-2">
                          <span className="text-xs font-semibold text-white truncate">{w.exerciseName}</span>
                          <span className="text-[10px] text-appGreen font-mono px-1.5 py-0.5 rounded-full bg-appGreenSubtle shrink-0">
                            {w.weight ? `${w.weight} kg` : "Bodyweight"}
                          </span>
                        </div>
                        <p className="text-xs text-gray-400 mt-0.5 font-mono tabular-nums">
                          {w.sets} sets × {w.reps} reps {totalVolume > 0 ? `· ${totalVolume} kg vol` : ""}
                        </p>
                        {w.notes && <p className="text-[11px] text-gray-500 italic truncate mt-0.5">{w.notes}</p>}
                        <span className="text-[10px] text-gray-600 block mt-1">{w.date}</span>
                      </div>
                      <div className="flex items-center space-x-1.5 shrink-0">
                        <button onClick={() => startEdit(w)} className="text-gray-400 hover:text-white text-xs px-2 py-1 rounded-lg hover:bg-white/[0.05]">
                          Edit
                        </button>
                        <button onClick={() => onDeleteWorkout(w.id)} className="text-gray-500 hover:text-red-400 text-xs px-2 py-1">
                          ✕
                        </button>
                      </div>
                    </div>
                  );
                })
              )}
            </div>
          )}

          {viewTab === "scheduled" && (
            <div className="space-y-4">
              <form onSubmit={handleScheduleSubmit} className="space-y-3 glass-panel p-4 rounded-2xl">
                <p className="text-xs font-semibold text-gray-300 uppercase tracking-wider">Schedule Upcoming Session</p>
                <div>
                  <label className="text-[11px] text-gray-400">Session Focus</label>
                  <input
                    type="text"
                    required
                    placeholder="e.g. Chest Press & Pull-up Hypertrophy"
                    value={schedTitle}
                    onChange={(e) => setSchedTitle(e.target.value)}
                    className="w-full mt-1 p-2.5 rounded-xl bg-black/70 border border-white/[0.08] text-xs text-white focus:outline-none"
                  />
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="text-[11px] text-gray-400">Date</label>
                    <input
                      type="date"
                      value={schedDate}
                      onChange={(e) => setSchedDate(e.target.value)}
                      className="w-full mt-1 p-2 rounded-xl bg-black/70 border border-white/[0.08] text-xs text-white focus:outline-none"
                    />
                  </div>
                  <div>
                    <label className="text-[11px] text-gray-400">Time</label>
                    <input
                      type="time"
                      value={schedTime}
                      onChange={(e) => setSchedTime(e.target.value)}
                      className="w-full mt-1 p-2 rounded-xl bg-black/70 border border-white/[0.08] text-xs text-white focus:outline-none"
                    />
                  </div>
                </div>
                <div>
                  <label className="text-[11px] text-gray-400">Details</label>
                  <input
                    type="text"
                    placeholder="4 sets of heavy DB press, deficit push-ups"
                    value={schedDetails}
                    onChange={(e) => setSchedDetails(e.target.value)}
                    className="w-full mt-1 p-2 rounded-xl bg-black/70 border border-white/[0.08] text-xs text-white focus:outline-none"
                  />
                </div>
                <button
                  type="submit"
                  className="w-full py-2.5 rounded-xl bg-appGreen text-black font-semibold text-xs mt-1 hover:bg-green-400 transition"
                >
                  Add Scheduled Workout
                </button>
              </form>

              <div className="space-y-2">
                {scheduledWorkouts.length === 0 ? (
                  <p className="text-xs text-gray-500 italic text-center py-4">No scheduled workouts planned.</p>
                ) : (
                  scheduledWorkouts.map(sw => (
                    <div key={sw.id} className="p-3.5 rounded-2xl glass-panel flex items-center justify-between">
                      <div>
                        <span className="text-xs font-semibold text-white">{sw.title}</span>
                        <p className="text-xs text-gray-400 mt-0.5">{sw.date} · {sw.time} {sw.details ? `• ${sw.details}` : ""}</p>
                      </div>
                      <button onClick={() => onDeleteScheduled(sw.id)} className="text-gray-500 hover:text-red-400 text-xs px-2 py-1">
                        ✕
                      </button>
                    </div>
                  ))
                )}
              </div>
            </div>
          )}

        </div>
      );
    }

    // ==========================================
    // 6. EXAM MARKS DASHBOARD 2.1 (SCHOOL & COACHING)
    // ==========================================
    function ExamMarksSection({ exams, onBackToMore, onAddExam, onDeleteExam }) {
      const [filter, setFilter] = useState("all"); // "all" | "School" | "Coaching"
      const [showModal, setShowModal] = useState(false);

      const calcStats = (examList) => {
        if (!examList || examList.length === 0) return { totalObt: 0, totalMax: 0, avgPct: 0, count: 0 };
        let o = 0, m = 0;
        examList.forEach(ex => {
          (ex.subjects || []).forEach(sub => {
            o += Number(sub.obtained) || 0;
            m += Number(sub.maxMarks) || 0;
          });
        });
        const pct = m > 0 ? (o / m) * 100 : 0;
        return { totalObt: o, totalMax: m, avgPct: pct, count: examList.length };
      };

      const schoolExams = useMemo(() => exams.filter(e => (e.category || "School") === "School"), [exams]);
      const coachingExams = useMemo(() => exams.filter(e => e.category === "Coaching"), [exams]);
      
      const displayedExams = useMemo(() => {
        if (filter === "School") return schoolExams;
        if (filter === "Coaching") return coachingExams;
        return exams;
      }, [filter, exams, schoolExams, coachingExams]);

      const activeStats = useMemo(() => calcStats(displayedExams), [displayedExams]);
      const overallStats = useMemo(() => calcStats(exams), [exams]);
      const schoolStats = useMemo(() => calcStats(schoolExams), [schoolExams]);
      const coachingStats = useMemo(() => calcStats(coachingExams), [coachingExams]);

      const getHeaderTitle = () => {
        if (filter === "School") return "School Academic Average";
        if (filter === "Coaching") return "Coaching Academic Average";
        return "Overall Academic Average";
      };

      return (
        <div className="p-4 space-y-4">
          {onBackToMore && (
            <button 
              onClick={onBackToMore}
              className="inline-flex items-center space-x-1 text-xs text-appGreen hover:text-green-300 font-medium transition"
            >
              <span>← Back to More</span>
            </button>
          )}
          {/* Header & Actions */}
          <div className="flex items-center justify-between">
            <div>
              <h1 className="text-xl font-bold tracking-tight text-white">Exam Marks</h1>
              <p className="text-xs text-gray-400 mt-0.5">School & coaching performance tracking</p>
            </div>
            <button
              onClick={() => setShowModal(true)}
              className="px-3 py-1.5 rounded-xl bg-appGreen text-black text-xs font-semibold hover:bg-green-400 transition shadow-lg shadow-green-500/10 flex items-center space-x-1"
            >
              <span>+ Add Test</span>
            </button>
          </div>

          {/* School vs Coaching Filter Segmented Tabs */}
          <div className="flex glass-tile p-1 rounded-xl text-xs">
            <button
              onClick={() => setFilter("all")}
              className={`flex-1 py-1.5 rounded-lg font-medium transition text-center ${
                filter === "all" ? "bg-white/[0.1] text-appGreen shadow-sm" : "text-gray-400 hover:text-white"
              }`}
            >
              All ({exams.length})
            </button>
            <button
              onClick={() => setFilter("School")}
              className={`flex-1 py-1.5 rounded-lg font-medium transition text-center ${
                filter === "School" ? "bg-white/[0.1] text-blue-400 shadow-sm" : "text-gray-400 hover:text-white"
              }`}
            >
              School ({schoolExams.length})
            </button>
            <button
              onClick={() => setFilter("Coaching")}
              className={`flex-1 py-1.5 rounded-lg font-medium transition text-center ${
                filter === "Coaching" ? "bg-white/[0.1] text-emerald-400 shadow-sm" : "text-gray-400 hover:text-white"
              }`}
            >
              Coaching ({coachingExams.length})
            </button>
          </div>

          {/* Academic Overview Radial Card */}
          <div className="p-4 rounded-2xl glass-panel flex items-center justify-between">
            <div className="space-y-1.5">
              <span className="text-[10px] font-semibold text-gray-400 uppercase tracking-wider block">
                {getHeaderTitle()}
              </span>
              <h2 className="text-2xl font-bold text-white font-mono tabular-nums leading-none">
                {activeStats.avgPct.toFixed(1)}%
              </h2>
              <p className="text-xs text-gray-400 font-mono tabular-nums">
                {activeStats.totalObt} / {activeStats.totalMax} total marks ({displayedExams.length} {displayedExams.length === 1 ? "entry" : "entries"})
              </p>

              {/* Sub-breakdown if viewing All */}
              {filter === "all" && (schoolExams.length > 0 || coachingExams.length > 0) && (
                <div className="flex items-center space-x-2 pt-1 text-[10px]">
                  <span className="px-2 py-0.5 rounded-md bg-blue-500/10 border border-blue-500/20 text-blue-300 font-mono">
                    School: {schoolStats.avgPct.toFixed(1)}%
                  </span>
                  <span className="px-2 py-0.5 rounded-md bg-emerald-500/10 border border-emerald-500/20 text-emerald-300 font-mono">
                    Coaching: {coachingStats.avgPct.toFixed(1)}%
                  </span>
                </div>
              )}
            </div>
            <CircularProgress percentage={activeStats.avgPct} size={76} strokeWidth={6.5} label="Avg" />
          </div>

          {/* Exam / Test Cards List */}
          <div className="space-y-3">
            {displayedExams.length === 0 ? (
              <div className="text-center py-10 glass-panel rounded-2xl p-6">
                <p className="text-xs text-gray-400">No {filter === "all" ? "" : filter.toLowerCase() + " "}exams recorded yet.</p>
                <button
                  onClick={() => setShowModal(true)}
                  className="mt-3 px-3 py-1.5 rounded-xl bg-white/[0.06] hover:bg-white/[0.1] text-xs text-gray-300 border border-white/[0.08] transition"
                >
                  Log your first {filter === "Coaching" ? "Coaching" : filter === "School" ? "School" : ""} test
                </button>
              </div>
            ) : (
              displayedExams.map(exam => {
                let examObt = 0, examMax = 0;
                (exam.subjects || []).forEach(s => {
                  examObt += Number(s.obtained) || 0;
                  examMax += Number(s.maxMarks) || 0;
                });
                const pct = examMax > 0 ? (examObt / examMax) * 100 : 0;
                const isCoaching = exam.category === "Coaching";
                const isSingleSubject = (exam.subjects || []).length === 1;

                return (
                  <div key={exam.id} className="p-4 rounded-2xl glass-panel hover:border-white/[0.14] transition space-y-3">
                    <div className="flex items-start justify-between">
                      <div className="space-y-1">
                        <div className="flex items-center space-x-1.5 flex-wrap gap-y-1">
                          <span className={`text-[10px] px-2 py-0.5 rounded-full font-semibold border ${
                            isCoaching
                              ? "border-emerald-500/30 text-emerald-400 bg-emerald-500/10"
                              : "border-blue-500/30 text-blue-400 bg-blue-500/10"
                          }`}>
                            {isCoaching ? "Coaching" : "School"}
                          </span>
                          {isSingleSubject && (
                            <span className="text-[10px] px-1.5 py-0.5 rounded-full border border-purple-500/30 text-purple-300 bg-purple-500/10">
                              Single Subject
                            </span>
                          )}
                          <span className="text-[10px] text-gray-500 font-mono">{exam.date}</span>
                        </div>
                        <h3 className="text-sm font-semibold text-white tracking-tight">{exam.name}</h3>
                      </div>
                      <div className="flex items-center space-x-2 shrink-0">
                        <span className="text-xs font-bold font-mono tabular-nums text-appGreen px-2 py-0.5 rounded-full bg-appGreenSubtle border border-appGreen/20">
                          {pct.toFixed(1)}%
                        </span>
                        <button
                          onClick={() => onDeleteExam(exam.id)}
                          className="text-gray-500 hover:text-red-400 text-xs p-1"
                          title="Delete Record"
                        >
                          ✕
                        </button>
                      </div>
                    </div>

                    {/* Subjects breakdown */}
                    <div className="space-y-1.5 pt-2 border-t border-white/[0.04]">
                      {(exam.subjects || []).map((sub, i) => {
                        const subPct = sub.maxMarks > 0 ? (sub.obtained / sub.maxMarks) * 100 : 0;
                        return (
                          <div key={i} className="flex items-center justify-between text-xs py-0.5">
                            <span className="text-gray-300 font-medium">{sub.name}</span>
                            <div className="flex items-center space-x-2">
                              <span className="font-mono text-gray-400 tabular-nums">
                                {sub.obtained} / {sub.maxMarks}
                              </span>
                              <span className="text-[11px] font-mono tabular-nums text-gray-400 w-11 text-right">
                                {subPct.toFixed(0)}%
                              </span>
                            </div>
                          </div>
                        );
                      })}
                    </div>

                    {exam.notes && (
                      <p className="text-[11px] text-gray-400 italic pt-1.5 border-t border-white/[0.04]">
                        {exam.notes}
                      </p>
                    )}
                  </div>
                );
              })
            )}
          </div>

          {showModal && (
            <AddExamModal
              defaultCategory={filter === "School" ? "School" : "Coaching"}
              onClose={() => setShowModal(false)}
              onSave={(record) => {
                onAddExam(record);
                setShowModal(false);
              }}
            />
          )}

        </div>
      );
    }

      const [category, setCategory] = useState(defaultCategory); // "School" | "Coaching"
      const [date, setDate] = useState(formatDateKey(new Date()));

      // Single-subject mode fields
      const [singleSubject, setSingleSubject] = useState("");

      const [singleMaxMarks, setSingleMaxMarks] = useState("100");

      const [multiName, setMultiName] = useState("");
      const [multiSubjects, setMultiSubjects] = useState([
        { name: "Mathematics", obtained: "", maxMarks: "100" },
        { name: "Physics", obtained: "", maxMarks: "100" }
      ]);

      const addMultiSubjectRow = () => {
        setMultiSubjects([...multiSubjects, { name: "", obtained: "", maxMarks: "100" }]);

    // ==========================================
    // 8. FOCUS TIMER & OMICRON / RAIN SOUNDSCAPE
    // ==========================================
    function FocusSection() {
      const [timeLeft, setTimeLeft] = useState(25 * 60);
      const [isRunning, setIsRunning] = useState(false);
      const [mode, setMode] = useState("pomodoro"); // pomodoro (25m), shortBreak (5m), longBreak (15m)
      const [soundMode, setSoundMode] = useState("none"); // none | omicron | rain | both
      const audioCtxRef = useRef(null);
      const oscillatorsRef = useRef([]);
      const gainNodeRef = useRef(null);
      const rainNodeRef = useRef(null);

      // Timer interval effect
      useEffect(() => {
        let timer = null;
        if (isRunning && timeLeft > 0) {
          timer = setInterval(() => {
            setTimeLeft(prev => prev - 1);
          }, 1000);
        } else if (timeLeft === 0 && isRunning) {
          setIsRunning(false);
          stopAudio();
          alert("Focus session complete! Great work.");
        }
        return () => clearInterval(timer);
      }, [isRunning, timeLeft]);

      const switchMode = (newMode, secs) => {
        setMode(newMode);
        setIsRunning(false);
        stopAudio();
        setTimeLeft(secs);
        setSoundMode("none");
      };

      const startAudio = (type) => {
        try {
          if (!audioCtxRef.current) {
            audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
          }
          const ctx = audioCtxRef.current;
          if (ctx.state === 'suspended') {
            ctx.resume();
          }
          stopAudio();

          const masterGain = ctx.createGain();
          masterGain.gain.setValueAtTime(0.15, ctx.currentTime);
          masterGain.connect(ctx.destination);
          gainNodeRef.current = masterGain;

          if (type === 'omicron' || type === 'both') {
            // 432Hz OM harmonic sacred frequency tone for deep calm & focus
            const osc1 = ctx.createOscillator();
            const osc2 = ctx.createOscillator();
            const osc3 = ctx.createOscillator();
            osc1.type = 'sine';
            osc2.type = 'sine';
            osc3.type = 'triangle';
            osc1.frequency.setValueAtTime(432, ctx.currentTime); // 432Hz OM foundation
            osc2.frequency.setValueAtTime(216, ctx.currentTime); // Sub-octave resonance
            osc3.frequency.setValueAtTime(108, ctx.currentTime); // Deep harmonic
            
            const omGain = ctx.createGain();
            omGain.gain.setValueAtTime(0.7, ctx.currentTime);
            osc1.connect(omGain);
            osc2.connect(omGain);
            osc3.connect(omGain);
            omGain.connect(masterGain);

            osc1.start();
            osc2.start();
            osc3.start();
            oscillatorsRef.current = [osc1, osc2, osc3];
          }

          if (type === 'rain' || type === 'both') {
            // High fidelity layered Rain soundscape generator (Brown noise + filtered pink noise + gentle droplet intervals)
            const bufferSize = ctx.sampleRate * 3;
            const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            let lastOut = 0.0;
            for (let i = 0; i < bufferSize; i++) {
              const white = Math.random() * 2 - 1;
              // Brown/Red noise formula for deep smooth rain roar
              output[i] = (lastOut + (0.02 * white)) / 1.02;
              lastOut = output[i];
              output[i] *= 1.8; // gain
            }
            const rainSource = ctx.createBufferSource();
            rainSource.buffer = noiseBuffer;
            rainSource.loop = true;

            const filter = ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(1200, ctx.currentTime);
            filter.Q.setValueAtTime(0.8, ctx.currentTime);

            const rainGain = ctx.createGain();
            rainGain.gain.setValueAtTime(0.4, ctx.currentTime);

            rainSource.connect(filter);
            filter.connect(rainGain);
            rainGain.connect(masterGain);
            rainSource.start();
            rainNodeRef.current = rainSource;
          }

          setSoundMode(type);
        } catch (e) {
          console.error("Audio error:", e);
        }
      };

      const stopAudio = () => {
        try {
          if (oscillatorsRef.current.length > 0) {
            oscillatorsRef.current.forEach(o => { o.stop(); o.disconnect(); });
            oscillatorsRef.current = [];
          }
          if (rainNodeRef.current) {
            rainNodeRef.current.stop();
            rainNodeRef.current.disconnect();
            rainNodeRef.current = null;
          }
          setSoundMode("none");
        } catch (e) {
          console.error("Stop audio error:", e);
        }
      };

      const formatTime = (secs) => {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      };

      const progressPct = (( (mode === "pomodoro" ? 25*60 : mode === "shortBreak" ? 5*60 : 15*60) - timeLeft ) / (mode === "pomodoro" ? 25*60 : mode === "shortBreak" ? 5*60 : 15*60)) * 100;

      return (
        <div className="p-4 space-y-4">
          <div className="flex items-center justify-between">
            <div>
              <h1 className="text-xl font-bold tracking-tight text-white">Focus Sanctuary</h1>
              <p className="text-xs text-gray-400 mt-0.5">Pomodoro timer with Omicron 100Hz & Rain soundscapes</p>
            </div>
          </div>

          {/* Mode Switcher Tabs */}
          <div className="flex glass-tile p-1 rounded-xl text-xs">
            <button
              onClick={() => switchMode("pomodoro", 25 * 60)}
              className={`flex-1 py-2 rounded-lg font-medium transition text-center ${
                mode === "pomodoro" ? "bg-white/[0.1] text-appGreen shadow-sm" : "text-gray-400 hover:text-white"
              }`}
            >
              Pomodoro (25m)
            </button>
            <button
              onClick={() => switchMode("shortBreak", 5 * 60)}
              className={`flex-1 py-2 rounded-lg font-medium transition text-center ${
                mode === "shortBreak" ? "bg-white/[0.1] text-cyan-400 shadow-sm" : "text-gray-400 hover:text-white"
              }`}
            >
              Short Break (5m)
            </button>
            <button
              onClick={() => switchMode("longBreak", 15 * 60)}
              className={`flex-1 py-2 rounded-lg font-medium transition text-center ${
                mode === "longBreak" ? "bg-white/[0.1] text-purple-400 shadow-sm" : "text-gray-400 hover:text-white"
              }`}
            >
              Long Break (15m)
            </button>
          </div>

          {/* Main Timer Display */}
          <div className="p-8 rounded-2xl glass-panel flex flex-col items-center justify-center space-y-6 relative overflow-hidden">
            <div className="absolute inset-0 bg-gradient-to-b from-appGreen/5 to-transparent pointer-events-none"></div>

            <div className="relative flex items-center justify-center">
              <div className="w-48 h-48 rounded-full border-4 border-white/[0.08] flex items-center justify-center relative">
                <div className="absolute inset-0 rounded-full border-4 border-appGreen animate-pulse opacity-45" style={{ clipPath: 'polygon(0 0, 100% 0, 100% 50%, 0 50%)' }}></div>
                <div className="text-center">
                  <h2 className="text-4xl font-extrabold text-white font-mono tabular-nums tracking-wider">
                    {formatTime(timeLeft)}
                  </h2>
                  <span className="text-[10px] text-appGreen font-semibold uppercase tracking-widest mt-1 block">
                    {isRunning ? "Deep Focus Active" : "Paused"}
                  </span>
                </div>
              </div>
            </div>

            {/* Controls */}
            <div className="flex items-center space-x-3 w-full max-w-xs">
              <button
                onClick={() => setIsRunning(!isRunning)}
                className={`flex-1 py-3 rounded-xl font-bold text-xs transition shadow-lg ${
                  isRunning
                    ? "bg-red-500/20 text-red-400 border border-red-500/30 hover:bg-red-500/30"
                    : "bg-appGreen text-black hover:bg-green-400"
                }`}
              >
                {isRunning ? "Pause Session" : "Start Focus"}
              </button>
              <button
                onClick={() => {
                  setIsRunning(false);
                  stopAudio();
                  setTimeLeft(mode === "pomodoro" ? 25*60 : mode === "shortBreak" ? 5*60 : 15*60);
                }}
                className="px-4 py-3 rounded-xl border border-white/[0.08] bg-white/[0.04] text-gray-300 text-xs font-semibold hover:bg-white/[0.08]"
              >
                Reset
              </button>
            </div>
          </div>

          {/* Soundscape Synthesizer */}
          <div className="p-4 rounded-2xl glass-panel space-y-3">
            <div className="flex items-center justify-between">
              <div>
                <h3 className="text-xs font-semibold text-white">Ambient Soundscapes</h3>
                <p className="text-[10px] text-gray-400">Synthesized 100Hz Omicron & soothing Rain generator</p>
              </div>
              {soundMode !== "none" && (
                <span className="text-[10px] px-2 py-0.5 rounded-full bg-appGreenSubtle text-appGreen border border-appGreen/30 animate-pulse">
